# Mouse: wheel scrolls the pane under the cursor (enters copy-mode), click
# selects panes, drag resizes. Without this, the terminal's own scrollback
# scrolls the whole window, mixing all split panes together.
set -g mouse on

# Per-pane scrollback (default is 2000 lines).
set -g history-limit 50000

# Ghostty: true color, and pass through clipboard/hyperlinks/extended keys.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:extkeys"
set -g extended-keys on
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10

# Mouse wheel. tmux's default sends the wheel to any full-screen (alternate
# screen) app, but less/man/git's pager don't enable mouse reporting, so the
# wheel did nothing there. Send them arrow keys instead, as plain Ghostty does.
# Apps that ask for the mouse (vim, btop, Claude Code fullscreen) still get it.
# Scroll 1 line per wheel event: Ghostty already sends several events per
# notch (mouse-scroll-multiplier), and tmux's default of 5 lines per event
# stacked on top made one notch jump ~25 lines.
bind -n WheelUpPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { if -F '#{alternate_on}' { send -t= Up } { copy-mode -e -t= } }
bind -n WheelDownPane if -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send -M } { if -F '#{alternate_on}' { send -t= Down } }
bind -T copy-mode-vi WheelUpPane select-pane \; send -X scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send -X scroll-down
bind -T copy-mode WheelUpPane select-pane \; send -X scroll-up
bind -T copy-mode WheelDownPane select-pane \; send -X scroll-down

# vi keys in copy-mode; y / mouse-drag copy. set-clipboard sends copies to the
# terminal's clipboard via OSC 52 (works on Linux and over ssh); on macOS also
# pipe to pbcopy so it works in terminals without OSC 52 (Terminal.app).
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
if 'command -v pbcopy >/dev/null' { set -s copy-command pbcopy }

# Prefix + r reloads this file.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
