# Mouse: wheel scrolls the pane under the cursor (enters copy-mode), click
# selects panes, drag resizes. Without this, the terminal's own scrollback
# scrolls the whole window, mixing all split panes together.
set -g mouse on

# Per-pane scrollback (default is 2000 lines).
set -g history-limit 50000

# Ghostty: true color, and pass through clipboard/hyperlinks/extended keys.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:extkeys"
set -g extended-keys on
set -g set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -sg escape-time 10

# vi keys in copy-mode; y / mouse-drag copies to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Prefix + r reloads this file.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
